name: Headless city soak

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asan_options: detect_leaks=1
          - os: macos-latest
            asan_options: detect_leaks=0
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: make install
      - name: Cook and drive the fixture city under sanitizers
        run: make soak
