# City generator settings. Metres unless stated.
chunk_size = 150
road_height = 0.06           # above the ground, clear of depth-buffer flicker
pavements = true
pavement_width = 2.0
kerb_height = 0.18           # pavement top; the kerb is this minus road_height
road_texture_length = 8        # metres of road per texture repeat
window_width = 3.0             # facade texture repeat across a wall
storey_height = 3.2            # facade texture repeat up a wall
facade_variants = 4
ground_uv_scale = 0.25         # repeats per metre
road_friction = 1.0
pavement_friction = 0.9
ground_friction = 0.7
building_friction = 0.6
lamp_spacing = 28              # metres between lamp posts, 0 for none
tree_spacing = 14              # metres between trees in parks, 0 for none
